name: Extract project archive

on:
  push:
    paths:
      - ".extract-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Safely extract project files
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import stat
          import zipfile

          archive = pathlib.Path("IND-AGENT-main.zip")
          if not archive.is_file():
              raise SystemExit("IND-AGENT-main.zip is missing")

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Archive integrity check failed: {bad}")

              entries = [i for i in z.infolist() if not i.is_dir()]
              for info in entries:
                  p = pathlib.PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0o170000
                  if p.is_absolute() or ".." in p.parts or mode == stat.S_IFLNK:
                      raise SystemExit(f"Unsafe archive entry: {info.filename}")
                  if not p.parts or p.parts[0] != "IND-AGENT-main":
                      raise SystemExit(f"Unexpected archive layout: {info.filename}")

              for info in entries:
                  relative = pathlib.PurePosixPath(info.filename).relative_to("IND-AGENT-main")
                  if not relative.parts:
                      continue
                  destination = pathlib.Path(*relative.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(info))

          print(f"Extracted {len(entries)} project files.")
          PY

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract IND-AGENT project files"
            git push
          fi
